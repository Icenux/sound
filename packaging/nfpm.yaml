# The .deb and the Arch package (.pkg.tar.zst) of sound, called by packaging/package.sh. Besides the application it sets up the shared
# Icenux APT repository (github.com/Icenux/icenux, by packaging/files/postinst.sh), so later versions
# arrive with the ordinary system update.
name: sound
arch: all
platform: linux
version: ${VERSION}
release: 1
section: sound
priority: optional
maintainer: Lukas <https://github.com/Icenux/sound>
description: |-
  Terminal UI for switching the default audio output on PipeWire and PulseAudio.
  Lists every output (speakers, HDMI, Bluetooth, USB), switches with a keypress and moves playing streams along.
vendor: Icenux
homepage: https://github.com/Icenux/sound
license: MIT

depends:
  - bash
  - jq
  - ncurses-bin
  - pulseaudio-utils (>= 1:16.0)

overrides:
  archlinux:
    depends:
      - bash
      - jq
      - ncurses
      - libpulse

contents:
  - src: sound
    dst: /usr/bin/sound
    file_info: { mode: 0755 }
  - src: LICENSE
    dst: /usr/share/doc/sound/copyright
    packager: deb

  # the Icenux package source: the files lie next to the application, postinst.sh puts them in place
  - src: packaging/files/icenux.asc
    dst: /usr/lib/sound/icenux.asc
    packager: deb
  - src: packaging/files/icenux.list
    dst: /usr/lib/sound/icenux.list
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/sound/LICENSE
    packager: archlinux

scripts:
  postinstall: packaging/files/postinst.sh
